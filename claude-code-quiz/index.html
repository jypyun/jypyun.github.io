<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 코드 퀴즈</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2b2b; --accent:#c8663a; --ok:#2e7d32; --no:#c62828; --line:#e5ddd2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:#666; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:#fff; padding:12px 14px; text-align:left; width:100%; margin:6px 0; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border:none; text-align:center; font-weight:bold; }
  button.ok { background:#e8f5e9; border-color:var(--ok); }
  button.no { background:#ffebee; border-color:var(--no); }
  button:disabled { cursor:default; }
  .topic small { display:block; color:#777; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .bar div { height:100%; background:var(--accent); transition:width .3s; }
  .tag { font-size:.85rem; color:var(--accent); font-weight:bold; }
  .explain { margin-top:12px; padding:12px; border-radius:10px; background:#f4efe7; }
  .score { font-size:2.4rem; font-weight:bold; text-align:center; color:var(--accent); }
  .hidden { display:none; }
  code { background:#f1ece3; padding:1px 5px; border-radius:4px; }
  ul.wrong { padding-left:20px; }
</style>
</head>
<body>
<main>
  <h1>클로드 코드 퀴즈</h1>
  <p class="sub">주제를 고르고 문제를 풀어 보세요. 답을 고르면 바로 정답과 설명이 나옵니다. 입력한 답은 어디에도 저장되지 않습니다.</p>

  <section id="home"></section>
  <section id="quiz" class="hidden"></section>
  <section id="result" class="hidden"></section>
</main>

<script>
const TOPICS = [
  { id:"basic", name:"기초: 클로드 코드가 뭐예요?", desc:"클로드 코드의 개념과 기본 사용법",
    qs:[
      { q:"클로드 코드(Claude Code)를 가장 잘 설명한 것은?",
        c:["이미지만 만들어 주는 프로그램","내 컴퓨터의 폴더 안에서 파일을 읽고 고치며 일을 도와주는 AI 도구","인터넷 검색만 해 주는 사이트","문서를 인쇄해 주는 프로그램"],
        a:1, e:"클로드 코드는 폴더 안의 파일을 읽고, 쓰고, 명령을 실행하며 작업을 도와주는 AI 도구입니다." },
      { q:"클로드 코드에게 일을 시키는 가장 기본적인 방법은?",
        c:["특별한 코드를 외워서 입력한다","평소 말하듯 한국어 같은 자연어로 요청한다","마우스로 버튼 100개를 누른다","전화를 건다"],
        a:1, e:"자연어로 하고 싶은 일을 말하면 됩니다. 프로그래밍 언어를 몰라도 시작할 수 있습니다." },
      { q:"클로드 코드가 파일을 고치거나 명령을 실행하려 할 때 보통 어떻게 하나요?",
        c:["무조건 몰래 실행한다","사용자에게 허용 여부를 물어본다(설정에 따라 다름)","항상 거부한다","인터넷에 먼저 올린다"],
        a:1, e:"기본적으로 중요한 작업 전에 사용자의 허락을 구합니다. 무엇을 허락할지는 권한 설정으로 조절합니다." },
      { q:"클로드 코드가 '작업 폴더'를 중요하게 여기는 이유는?",
        c:["폴더가 예뻐서","그 폴더 안의 파일을 기준으로 읽고 고치며 일하기 때문","폴더가 없으면 전원이 꺼져서","폴더 이름이 점수가 되어서"],
        a:1, e:"클로드 코드는 지정된 작업 폴더를 기준으로 일합니다. 그래서 자료를 어느 폴더에 두었는지가 중요합니다." }
    ]},
  { id:"claudemd", name:"CLAUDE.md와 규칙", desc:"클로드에게 규칙을 알려 주는 방법",
    qs:[
      { q:"CLAUDE.md 파일의 역할은?",
        c:["성적표","클로드가 그 폴더에서 일할 때 지킬 규칙과 배경 설명을 적어 두는 파일","사진 보관함","비밀번호 저장소"],
        a:1, e:"CLAUDE.md에 적어 둔 내용은 클로드가 작업을 시작할 때 읽고 따릅니다." },
      { q:"클로드가 매번 똑같이 행동하게 하고 싶을 때 가장 알맞은 방법은?",
        c:["매번 처음부터 길게 설명한다","규칙을 CLAUDE.md에 한 번 적어 둔다","컴퓨터를 껐다 켠다","아무것도 안 한다"],
        a:1, e:"반복되는 규칙은 CLAUDE.md에 적어 두면 대화마다 다시 말하지 않아도 됩니다." },
      { q:"좋은 규칙 문장은 어떤 것일까요?",
        c:["'알아서 잘 해 줘'","'학생 이름은 위키에 옮기지 않는다'처럼 구체적이고 확인할 수 있는 문장","'최고로 완벽하게'","'음…'"],
        a:1, e:"구체적이고 확인 가능한 규칙이어야 클로드가 정확히 따를 수 있습니다." }
    ]},
  { id:"prompt", name:"요청 잘하기", desc:"원하는 결과를 얻는 말하기 요령",
    qs:[
      { q:"다음 중 가장 좋은 요청은?",
        c:["'퀴즈 만들어'","'3주차 내용으로 객관식 5문제를 만들고, 정답 설명도 붙여 줘'","'알아서'","'뭐라도 해 줘'"],
        a:1, e:"무엇을, 얼마나, 어떤 형태로 원하는지 말하면 결과가 훨씬 좋아집니다." },
      { q:"결과가 마음에 들지 않을 때 가장 좋은 대응은?",
        c:["포기한다","무엇이 아쉬운지 구체적으로 말하고 고쳐 달라고 한다","같은 말을 큰 소리로 반복한다","컴퓨터를 바꾼다"],
        a:1, e:"AI와는 대화로 다듬어 갑니다. 어디를 어떻게 바꾸고 싶은지 말해 주세요." },
      { q:"AI가 만든 결과를 사용하기 전에 꼭 해야 할 일은?",
        c:["그대로 믿고 제출한다","내용이 맞는지 직접 확인한다","친구에게 대신 맡긴다","무시한다"],
        a:1, e:"AI는 틀린 내용을 그럴듯하게 쓸 수도 있습니다. 사실 확인은 사람의 몫입니다." }
    ]},
  { id:"safety", name:"안전하게 쓰기", desc:"개인정보와 책임 있는 사용",
    qs:[
      { q:"AI에게 자료를 줄 때 조심해야 할 것은?",
        c:["없다","이름·연락처 같은 개인정보와 비밀번호","글자 크기","파일 색깔"],
        a:1, e:"개인정보, 비밀번호, 인증 키 같은 민감한 정보는 넣지 않는 것이 안전합니다." },
      { q:"AI가 알려 준 '출처'나 '인용'을 쓸 때 올바른 태도는?",
        c:["그대로 복사한다","실제로 존재하는 자료인지 직접 찾아 확인한다","출처는 필요 없다","친구에게 물어본다"],
        a:1, e:"AI가 없는 출처를 지어낼 수 있습니다. 반드시 원문을 확인하세요." },
      { q:"과제에 AI를 활용했다면 가장 바람직한 행동은?",
        c:["숨긴다","수업에서 정한 규칙에 따라 어떻게 사용했는지 밝힌다","남의 이름으로 낸다","AI 탓을 한다"],
        a:1, e:"AI 활용 범위와 공개 방식은 수업마다 규칙이 다릅니다. 규칙을 따르고 사용 사실을 정직하게 밝히세요." }
    ]}
];

const $ = id => document.getElementById(id);
let topic, idx, score, wrongs;

function showHome() {
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden"); $("home").classList.remove("hidden");
  $("home").innerHTML = '<div class="card"><b>퀴즈 주제를 고르세요</b>' +
    TOPICS.map((t,i)=>`<button class="topic" onclick="start(${i})">${t.name}<small>${t.desc} · ${t.qs.length}문제</small></button>`).join("") +
    '<button class="topic" onclick="start(-1)">전체 도전<small>모든 주제에서 섞어서 풀기</small></button></div>';
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(i) {
  const pool = i<0 ? TOPICS.flatMap(t=>t.qs) : TOPICS[i].qs;
  topic = { name: i<0 ? "전체 도전" : TOPICS[i].name, qs: shuffle(pool) };
  idx = 0; score = 0; wrongs = [];
  $("home").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  render();
}

function render() {
  const q = topic.qs[idx];
  // 보기 순서를 섞되 정답 위치를 추적
  const order = shuffle(q.c.map((t,k)=>({t,k})));
  $("quiz").innerHTML = `<div class="card">
    <div class="tag">${topic.name} · ${idx+1} / ${topic.qs.length}</div>
    <div class="bar"><div style="width:${idx/topic.qs.length*100}%"></div></div>
    <p><b>${q.q}</b></p>
    <div id="choices">${order.map(o=>`<button data-k="${o.k}">${o.t}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  document.querySelectorAll("#choices button").forEach(b=>b.onclick=()=>answer(b,q));
}

function answer(btn, q) {
  const k = +btn.dataset.k, right = k===q.a;
  document.querySelectorAll("#choices button").forEach(b=>{
    b.disabled = true;
    if (+b.dataset.k===q.a) b.classList.add("ok");
  });
  if (!right) btn.classList.add("no");
  if (right) score++; else wrongs.push(q);
  const last = idx===topic.qs.length-1;
  $("fb").innerHTML = `<div class="explain"><b>${right?"정답입니다! 🎉":"아쉬워요, 오답입니다."}</b><br>${q.e}</div>
    <button class="primary" style="margin-top:12px" onclick="next()">${last?"결과 보기":"다음 문제"}</button>`;
}

function next() {
  idx++;
  if (idx<topic.qs.length) render(); else finish();
}

function finish() {
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const n = topic.qs.length, pct = Math.round(score/n*100);
  const msg = pct===100 ? "만점이에요! 훌륭해요." : pct>=70 ? "잘했어요!" : "조금만 더 복습하면 좋아요.";
  $("result").innerHTML = `<div class="card"><div class="tag">${topic.name}</div>
    <div class="score">${score} / ${n}</div><p style="text-align:center">${pct}점 · ${msg}</p>
    ${wrongs.length ? `<b>다시 볼 문제</b><ul class="wrong">${wrongs.map(q=>`<li>${q.q}<br><small>→ ${q.c[q.a]}</small></li>`).join("")}</ul>` : ""}
    <button class="primary" onclick="start(${TOPICS.findIndex(t=>t.name===topic.name)})">같은 주제 다시 풀기</button>
    <button class="primary" style="margin-top:6px;background:#555" onclick="showHome()">주제 고르기로</button></div>`;
}

showHome();
</script>
</body>
</html>
